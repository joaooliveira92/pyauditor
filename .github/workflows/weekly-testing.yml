name: Weekly testing assessment

# Ciclo semanal de saúde do repo. Se o ciclo falhar, um issue é criado no
# tracker (ticket 05) — o token deste workflow tem escopo mínimo: `contents:
# read` no workflow e `issues: write` APENAS no job `assess` (job-level
# permissions), nada além do necessário.
#
# Actions pinadas por SHA (ticket 03): a tag de release fica no comentário.

on:
  schedule:
    - cron: '17 12 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-testing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assess:
    name: Assess test health
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Verify lockfile
        run: uv lock --check
      - name: Synchronize environment
        run: uv sync --locked --group dev
      - name: Ruff (check e format, repo inteiro)
        run: |
          set -euo pipefail
          uv run --locked ruff check .
          uv run --locked ruff format --check .
      - name: Type check (ty, pinado, config-driven)
        # `ty` é tool global do repo (Q1/A do wayfinder migracao-ty), não
        # dependência do projeto — no CI o `uv run ty` não o acharia; vai via
        # `uvx` na versão pinada que mediu o baseline (ticket 06). `check`
        # sem paths usa o `[tool.ty]` como escopo, igual ao comando local.
        run: uvx ty@0.0.73 check
      - name: Tests and branch coverage
        # Gate de cobertura explícito (ticket 05): `--cov-fail-under=85`.
        run: uv run --locked pytest --cov=pyauditor --cov-branch --cov-report=term-missing --cov-report=xml --junitxml=junit.xml --durations=20 --cov-fail-under=85
      - name: Security checks
        run: |
          set -euo pipefail
          uv run --locked bandit -r src
          uv run --locked pip-audit
      - name: Complexity report (radon, pinado)
        # Observabilidade de complexidade ciclomática semanal (não é gate de
        # PR — o gate é o xenon no quality.yml). Gera o JSON anexado ao
        # artifact para acompanhar a evolução da dívida de complexidade mapeada
        # no relatório SRP (baseline medido com radon 6.0.1/xenon 0.9.3).
        # `--min D` foca só nos módulos que importam: não polui o relatório com
        # dezenas de blocos rank A/B.
        run: uvx radon@6.0.1 cc src --average --min D -j > complexity.json
      - name: Create assessment
        if: always()
        run: python scripts/assess_project.py --output weekly-testing-assessment.json
      - name: Upload assessment
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: weekly-testing-assessment-${{ github.run_id }}
          path: |
            weekly-testing-assessment.json
            complexity.json
            coverage.xml
            junit.xml
          if-no-files-found: warn
          retention-days: 30
      - name: Create issue on failure
        # Falha do ciclo semanal vira issue no tracker (ticket 05), com
        # contexto suficiente para diagnóstico (workflow, job e run id).
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh issue create \
            --title "Falha no ciclo semanal de testes (run ${{ github.run_id }})" \
            --body "Workflow: ${{ github.workflow }}
          Job: ${{ github.job }}
          Run: ${{ github.run_id }}
          URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          O ciclo semanal de qualidade (ruff + ty + pytest + segurança) falhou. Ver o run acima para detalhes do passo que quebrou."
