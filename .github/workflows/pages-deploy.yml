# Deploy unificado do GitHub Pages (wayfinder pipeline-maturidade, tickets 01 e 04).
# Substitui docs.yml + static.yml: constrói o site estático (zensical) e publica
# APENAS o conteúdo publicável em `site/` — a working tree inteira não sobe mais
# (o static.yml antigo publicava `path: '.'`, vazando .scratch/ e /docs/ com PII).
#
# Deploys saem de `master` (fluxo dev -> master). `concurrency` serializa deploys
# (um por vez) e `cancel-in-progress: false` deixa o deploy em andamento concluir.
# `timeout-minutes` limita o job contra loops/rebuilds que travem.

name: Deploy Pages

on:
  push:
    branches:
      - master
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Build docs (zensical, determinístico via uv.lock)
        run: |
          set -euo pipefail
          uv sync --locked --group docs
          uv run --locked zensical build --clean
      - name: Upload publicable artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5