name: Quality gates

# Wf de qualidade do repo (ty + ruff + pytest), rodando no push/PR.
# Fluxo dev -> master (wayfinder pipeline-maturidade, ticket 02): o CI roda em
# push para `dev` e `master` (e `main`) e em toda PR.
#
# Matriz Python 3.12/3.13 (ticket 06) com `fail-fast: false` — uma versão
# quebrar não cancela a outra. Cada entrada da matriz publica o check
# "Quality (x.y)"; o job agregado `quality-gates` publica o check único
# "Quality gates" que a branch protection exige (dev e master).
#
# Gate de estilo segue o CODING_STANDARDS.md e o pyguide.md §2.1.1 — os MESMOS
# commands da checagem local ("Antes de declarar uma tarefa concluída"):
#   - `ruff check .` e `ruff format --check .` (escopo do repo inteiro, com as
#     exclusões definidas em `[tool.ruff]` no pyproject.toml);
#   - `ty check` (config-driven via `[tool.ty]`; o `uvx ty@0.0.73` é pinado na
#     versão que mediu o baseline — o ty NÃO é dependência do projeto, decisão
#     Q1/A do wayfinder: instalado globalmente via `uv tool install ty@latest`);
#   - `pytest --cov-fail-under=85`.
#
# O default `terminal.error-on-warning = true` do ty faz qualquer warning falhar
# o gate (é o "strict do ty" decidido no ticket 03 — sem tolerância).
#
# Actions pinadas por SHA (ticket 03): a tag de release fica no comentário.

on:
  push:
    branches:
      - master
      - main
      - dev
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify lockfile
        run: uv lock --check
      - name: Synchronize environment
        run: uv sync --locked --group dev
      - name: Ruff (check e format, repo inteiro)
        # Escopo documentado no CODING_STANDARDS.md: `ruff check .` e
        # `ruff format --check .`, com as exclusões do `[tool.ruff]`.
        run: |
          set -euo pipefail
          uv run --locked ruff check .
          uv run --locked ruff format --check .
      - name: Type check (ty, pinado, config-driven)
        # Mesmo comando local `ty check` (CODING_STANDARDS.md): usa o
        # `[tool.ty]` do pyproject como única fonte de escopo (src/tests).
        run: uvx ty@0.0.73 check
      - name: Complexity gate (xenon, pinado)
        # Gate de complexidade ciclomática via `uvx` (ferramenta global do
        # repo como o ty — não é dependência do projeto). Baseline medido com
        # radon 6.0.1/xenon 0.9.3 no relatório SRP (2026-08-22).
        #
        # Limites ATUAIS: absoluto F, média C — passa com o baseline de hoje,
        # cujos piores blocos são `cli/split.run_split` (F),
        # `excel/sintetico/workbook.write_sintetico_workbook` (E) e
        # `orchestration/run.execute_run`, `cli/report.run_report`,
        # `orchestration/summary._result_panel` (D).
        #
        # Plano de aperto (apertar só após a refatoração SRP de cada bloco):
        #   1. -> --max-absolute D --max-average C (quando run_split e
        #      write_sintetico_workbook saírem de F/E);
        #   2. -> --max-absolute C --max-average B (quando os blocos D e os
        #      demais rank C forem extraídos).
        # O objetivo do gate é impedir REGRESSÃO de complexidade em PRs, não
        # travar o repo no débito já mapeado.
        run: uvx xenon@0.9.3 src --max-absolute F --max-average C
      - name: Tests and branch coverage
        # Gate de cobertura explícito (ticket 05): `--cov-fail-under=85` no
        # comando, não só no `[tool.coverage.report]` do pyproject.
        run: uv run --locked pytest --cov-fail-under=85

  quality-gates:
    name: Quality gates
    if: always()
    needs: [quality]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate quality result
        run: |
          set -euo pipefail
          if [ "${{ needs.quality.result }}" = "success" ]; then
            echo "Todas as verificações de qualidade passaram (3.12 e 3.13)."
          else
            echo "::error::Quality gates falhou em pelo menos uma versão do Python."
            exit 1
          fi
