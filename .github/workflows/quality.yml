name: Quality gates

# Wf de qualidade do repo (ty + ruff + pytest), rodando no push/PR.
# Fluxo dev -> master (wayfinder pipeline-maturidade, ticket 02): o CI roda em
# push para `dev` e `master` (e `main`) e em toda PR.
#
# Matriz Python 3.12/3.13 (ticket 06) com `fail-fast: false` — uma versão
# quebrar não cancela a outra. Cada entrada da matriz publica o check
# "Quality (x.y)"; o job agregado `quality-gates` publica o check único
# "Quality gates" que a branch protection exige (dev e master).
#
# o `ty` NÃO é dependência do projeto (decisão Q1/A do wayfinder: instalado
# globalmente via `uv tool install ty@latest`), então o CI o resolve via
# `uvx ty@0.0.73` — pinado na versão que mediu o baseline. O default
# `terminal.error-on-warning = true` do ty faz qualquer warning falhar o gate
# (é o "strict do ty" decidido no ticket 03 — sem tolerância).
#
# Actions pinadas por SHA (ticket 03): a tag de release fica no comentário.

on:
  push:
    branches:
      - master
      - main
      - dev
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify lockfile
        run: uv lock --check
      - name: Synchronize environment
        run: uv sync --locked --group dev
      - name: Ruff
        run: |
          set -euo pipefail
          uv run --locked ruff check src tests
          uv run --locked ruff format --check src tests
      - name: Type check (ty, pinado)
        run: uvx ty@0.0.73 check src tests
      - name: Tests and branch coverage
        # Gate de cobertura explícito (ticket 05): `--cov-fail-under=85` no
        # comando, não só no `[tool.coverage.report]` do pyproject.
        run: uv run --locked pytest --cov-fail-under=85

  quality-gates:
    name: Quality gates
    if: always()
    needs: [quality]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate quality result
        run: |
          if [ "${{ needs.quality.result }}" = "success" ]; then
            echo "Todas as verificações de qualidade passaram (3.12 e 3.13)."
          else
            echo "::error::Quality gates falhou em pelo menos uma versão do Python."
            exit 1
          fi
