# Supply-chain (ticket 03): Dependabot mantém actions pinadas por SHA e o
# lockfile do uv atualizados. Cada atualização chega como PR apontando para
# `dev` (`target-branch`) e passa pelo gate de qualidade ("Quality gates")
# antes de subir via PR dev -> master — nunca direto no `master`.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    labels:
      - dependencies
    commit-message:
      prefix: ci
  - package-ecosystem: uv
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    labels:
      - dependencies
    commit-message:
      prefix: deps