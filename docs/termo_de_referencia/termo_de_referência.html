<script type="text/javascript">
document.addEventListener('DOMContentLoaded', function () {
    var targets = Array.prototype.slice.call(document.querySelectorAll('[data-include]'));
    Promise.all(targets.map(function (target) {
        var file = target.getAttribute('data-include');
        return fetch(file).then(function (response) {
            if (!response.ok) throw new Error(file + ': HTTP ' + response.status);
            return response.text();
        }).then(function (content) {
            target.innerHTML = content;
            target.setAttribute('data-include-loaded', 'true');
        }).catch(function (error) {
            target.setAttribute('data-include-error', 'true');
            target.innerHTML = '<p style="color:#b00020">Erro ao carregar ' + file + '</p>';
            console.error('Erro ao carregar componente:', error);
        });
    })).then(function () {
        if (window.MathJax && MathJax.Hub) MathJax.Hub.Queue(['Typeset', MathJax.Hub]);
    });
});
</script>
