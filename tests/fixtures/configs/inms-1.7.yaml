indicator:
  id: INMS-1.7
  contractual_id: "INMS 1.7"
  name: Satisfação dos usuários

scope:
  contract: "40/2022 - Ministério Cultura"
  orgao: MinC

source:
  csv: inms-07.csv
  delimiter: ";"
  encoding: utf-8-sig
  id_column: "Nº Ticket"

quality_gates:
  checks:
    # Anexo D define 5 categorias de avaliação; linhas com "Avaliação
    # Automática" ou texto malformado (o CSV real tem várias linhas com
    # conteúdo de outros campos vazado para a coluna Avaliação — texto livre
    # de comentários de outros tickets, provavelmente por um delimitador ";"
    # dentro do texto quebrando o alinhamento das colunas) são rejeitadas,
    # não contam como avaliação real.
    - type: in_set
      column: "Avaliação"
      values:
        - "Muito Insatisfeito"
        - "Insatisfeito"
        - "Parcialmente satisfeito"
        - "Satisfeito"
        - "Muito Satisfeito"

calculation:
  shape: ratio
  aggregation: count_distinct
  numerator_filter:
    column: "Avaliação"
    in_values: ["Satisfeito", "Muito Satisfeito"]

target:
  operator: ">="
  value: 80.0

penalty:
  step_points: 250
  step_size_pct: 1.0

# Anexo D (Tabela 28), INMS 1.7: INMS 1.7 = TAP/TA × 100, meta ≥80%, 250
# pontos a cada 1% abaixo da meta. O /input/inms-001-07.csv real, após o
# quality gate acima, tem 40 avaliações reais (22 "Muito Satisfeito" + 18
# "Satisfeito"), nenhuma negativa registrada — TAP=TA=40, 100%.
acceptance_test:
  expected:
    shape: ratio
    numerator: 40
    denominator: 40
    result_pct: 100.0
    conforms: true
    penalty_points: 0.0
