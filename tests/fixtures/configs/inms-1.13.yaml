indicator:
  id: INMS-1.13
  contractual_id: "INMS 1.13"
  name: Índice de chamados atendidos no Nível I

scope:
  contract: "40/2022 - Ministério Cultura"
  orgao: MinC

source:
  csv: inms-13.csv
  delimiter: ";"
  encoding: utf-8-sig

quality_gates:
  checks: []

calculation:
  shape: precomputed_table
  result_column: inms_1_13_percentual
  name_column: unidade_nome
  numerator_column: tcn1_chamados_atendidos_nivel_1
  denominator_column: tcr_total_chamados_registrados
  penalty_column: penalidade_pontos

target:
  operator: ">="
  # Anexo D não fixa um percentual para INMS 1.13 — o texto diz "Será
  # acordado com a CONTRATADA uma taxa... revisão trimestral". 90% é um
  # placeholder documentado, não um valor contratual; precisa ser confirmado
  # com o gestor do contrato antes de uso em produção.
  value: 90.0

penalty:
  step_points: 50
  step_size_pct: 1.0

acceptance_test:
  expected:
    shape: precomputed_table
    result_pct: 75.05
    conforms: false
    penalty_points: 1000.0
