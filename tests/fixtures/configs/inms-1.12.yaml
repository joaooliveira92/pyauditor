indicator:
  id: INMS-1.12
  contractual_id: "INMS 1.12"
  name: Índice de chamadas telefônicas atendidas em até 20 segundos

scope:
  contract: "40/2022 - Ministério Cultura"
  orgao: MinC

source:
  csv: inms-12.csv
  delimiter: ";"
  encoding: utf-8-sig

quality_gates:
  checks: []

calculation:
  shape: ratio
  aggregation: count_distinct
  numerator_filter:
    column: "ESPERA"
    max_seconds: 20

target:
  operator: ">="
  value: 95.0

penalty:
  step_points: 25
  step_size_pct: 0.1

acceptance_test:
  expected:
    shape: ratio
    numerator: 885
    denominator: 924
    result_pct: 95.7792
    conforms: true
    penalty_points: 0.0
