indicator:
  id: INMS-1.2
  contractual_id: "INMS 1.2"
  name: Requisições atendidas dentro do prazo

scope:
  contract: "40/2022 - Ministério Cultura"
  orgao: MinC

source:
  csv: inms-02.csv
  delimiter: ";"
  encoding: utf-8-sig

quality_gates:
  checks:
    - type: in_set
      column: "No prazo"
      values: ["S", "N"]

calculation:
  shape: segmented_ratio
  step_size_pct: 0.1
  categories:
    - name: alta
      denominator_filter:
        column: "SLA"
        contains: "Alta"
      numerator_filter:
        column: "No prazo"
        equals: "S"
      step_points: 20
    - name: media
      denominator_filter:
        column: "SLA"
        contains: "Média"
      numerator_filter:
        column: "No prazo"
        equals: "S"
      step_points: 15
    - name: baixa
      denominator_filter:
        column: "SLA"
        contains: "Baixa"
      numerator_filter:
        column: "No prazo"
        equals: "S"
      step_points: 10

target:
  operator: ">="
  value: 95.0

# Anexo D (Tabela 28) não tem uma coluna de prioridade dedicada — a
# prioridade vem embutida no texto livre de `SLA` (ex.: "(CIT) Requisição -
# Alta 04 horas", "(URA) Triagem - Alta 30 mim"). Os 11 valores distintos de
# SLA no /input/inms-001-02.csv real contêm exatamente uma das palavras
# Alta/Média/Baixa cada, sem sobreposição — a classificação por substring é
# plausível e cobre 100% das 1514 linhas, mas não é confirmada por nenhuma
# fonte primária como o mecanismo oficial (mesma natureza de lacuna do
# ticket 11 para o INMS 1.8).
acceptance_test:
  expected:
    shape: segmented_ratio
    result_pct: 98.41
    conforms: true
    penalty_points: 0.0
    categories:
      - name: alta
        numerator: 524
        denominator: 533
        result_pct: 98.31
        penalty_points: 0.0
      - name: media
        numerator: 461
        denominator: 464
        result_pct: 99.35
        penalty_points: 0.0
      - name: baixa
        numerator: 505
        denominator: 517
        result_pct: 97.68
        penalty_points: 0.0
