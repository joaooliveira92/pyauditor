name: Weekly testing assessment

on:
  schedule:
    - cron: '17 12 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-testing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assess:
    name: Assess test health
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Replace release tags with audited full commit SHAs before production use.
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify lockfile
        run: uv lock --check
      - name: Synchronize environment
        run: uv sync --locked --group dev
      - name: Ruff
        run: |
          set -euo pipefail
          uv run --locked ruff check src tests
          uv run --locked ruff format --check src tests
      - name: Type check
        run: uv run --locked ty check
      - name: Tests and branch coverage
        run: uv run --locked pytest --cov=pyauditor --cov-branch --cov-report=term-missing --cov-report=xml --junitxml=junit.xml --durations=20
      - name: Security checks
        run: |
          set -euo pipefail
          uv run --locked bandit -r src
          uv run --locked pip-audit
      - name: Create assessment
        if: always()
        run: python scripts/assess_project.py --output weekly-testing-assessment.json
      - name: Upload assessment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-testing-assessment-${{ github.run_id }}
          path: |
            weekly-testing-assessment.json
            coverage.xml
            junit.xml
          if-no-files-found: warn
          retention-days: 30
