[project]
name = "pyauditor"
version = "0.1.0"
description = "Command-line tool for auditing and validating Excel workbooks using configurable rules."
readme = "README.md"
authors = [
    { name = "Joao Antonio Oliveira", email = "joao.oliveira@cultura.gov.br" }
]
requires-python = ">=3.12"
dependencies = [
    "defusedxml>=0.7.1",
    "loguru>=0.7.3",
    "openpyxl>=3.1.5",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
]

[project.scripts]
pyauditor = "pyauditor:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    { include-group = "test" },
    { include-group = "quality" },
    { include-group = "security" },
]

test = [
    "hypothesis>=6",
    "pytest>=9.1.1",
    "pytest-cov>=7.1",
]

quality = [
    "mypy>=2.3.1",
    "ruff>=0.12",
    "types-openpyxl>=3.1.5.20260807",
    "types-pyyaml>=6.0.12.20260815",
]

security = [
    "bandit>=1.9",
    "pip-audit>=2.10",
]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.coverage.run]
branch = true
source = ["pyauditor"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--import-mode=importlib",
    "--strict-config",
    "--strict-markers",
    "--cov=pyauditor",
    "--cov-branch",
    "--cov-report=term-missing",
]