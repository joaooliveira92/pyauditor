[project]
name = "pyauditor"
version = "0.1.0"
description = "Command-line tool for auditing and validating Excel workbooks using configurable rules."
readme = "README.md"
authors = [
    { name = "Joao Antonio Oliveira", email = "joao.oliveira@cultura.gov.br" }
]
requires-python = ">=3.12"
dependencies = [
    "defusedxml>=0.7.1",
    "loguru>=0.7.3",
    "openpyxl>=3.1.5",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "questionary>=2.1.1",
    "rich>=15.0.0",
]

[project.scripts]
pyauditor = "pyauditor:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    { include-group = "test" },
    { include-group = "quality" },
    { include-group = "security" },
]

test = [
    "hypothesis>=6",
    "pytest>=9.1.1",
    "pytest-cov>=7.1",
]

quality = [
    "ruff>=0.12",
    "types-openpyxl>=3.1.5.20260807",
    "types-pyyaml>=6.0.12.20260815",
]

security = [
    "bandit>=1.9",
    "pip-audit>=2.10",
]
docs = [
    "zensical>=0.0.56",
]

[tool.ty]
# Perfil estrito do ty (default do ty, sem os report* "none" do basedpyright).
# Decisões do wayfinder migracao-ty (ticket 03), com base no delta medido no
# ticket 02 (notes/estado-ty.md):
#   - respect-type-ignore-comments = false (Q5/a): só `# ty: ignore[<rule>]`
#     suprime; `# type: ignore[...]` vira comentário normal.
#   - strict-equality-semantics / strict-generic-narrowing = false (default):
#     medido no ticket 02 — ligar custa +26 diag sem ganho (delta 0 / +26).
#   - terminal.error-on-warning = true (default): o perfil estrito falha em
#     qualquer warning, alinhado ao gate de CI (ticket 06).
[tool.ty.analysis]
respect-type-ignore-comments = false

[tool.ty.src]
include = ["src", "tests"]
exclude = [".scratch"]

[tool.ty.environment]
python-version = "3.12"

[tool.ruff]
target-version = "py312"
line-length = 80
src = ["src", "tests"]
extend-exclude = [".scratch", ".agents"]

[tool.ruff.lint]
preview = true
extend-select = ["ANN", "PYI", "ISC001", "ISC003"]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
    "RUF",
    "N",
    "W",
    "G",
    "S101",
]
# Cláusulas do pyguide.md: §3.16 naming (N), §3.6 whitespace (W),
# §3.10.1 logging (G), §2.4 sem assert em produção (S101).
# ISC001/ISC003 (wayfinder suite-testes, ticket 02): gate contra costura de
# strings adjacentes numa mesma linha, reintroduzindo o defeito acidental
# reparado no ticket 03. ISC002 (multi-linha) fica de fora de propósito —
# `allow-multiline = false` provou 746 falsos positivos no código real (o
# repo constrói f-strings/tabelas Markdown deliberadamente em várias linhas,
# ex. `rom/render.py`); o Ruff não tem opção "exigir espaço na junção", só
# "proibir junção", então o rigor multi-linha não isola o defeito real.
# pt-BR usa en-dash em intervalos ("01/06–30/06") — spec competencia-cli-equipe
# §3 exige mensagens verbatim com ele.
allowed-confusables = ["–"]

[tool.ruff.lint.per-file-ignores]
# ANN em tests: fixtures de pytest (tmp_path etc.) ficam fora do contrato de
# anotação obrigatória, e as *spies* de test-double que repassam args usam
# `*args: Any, **kwargs: Any` de propósito (call-through, não dívida de tipo).
# RUF069 (preview, ligada pelo `preview = true`): asserts de teste comparam
# valores decimais exatos e determinísticos (ex. `== 100.0`) — check de
# invariante, não ponto-flutuante propenso a arredondamento.
"tests/**/*.py" = ["S101", "ANN001", "ANN002", "ANN003", "ANN401", "RUF069"]

[tool.ruff.format]
# pyguide.md §3.10: escolha única de aspas, prefere `'`.
quote-style = "single"

[tool.coverage.run]
branch = true
source = ["pyauditor"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--import-mode=importlib",
    "--strict-config",
    "--strict-markers",
    "--cov=pyauditor",
    "--cov-branch",
    "--cov-report=term-missing",
]
