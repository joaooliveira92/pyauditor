indicator:
  id: INMS-1.5
  contractual_id: "INMS 1.5"
  name: Disponibilidade de sistema/serviço não-crítico

scope:
  contract: "40/2022 - Ministério Cultura"
  orgao: MinC

source:
  dataset: disponibilidade_sistema_nao_critico

quality_gates:
  checks: []

calculation:
  shape: precomputed_table
  result_column: inms_1_5_percentual
  name_column: sistema_servico_nome
  numerator_column: numerador_inms_horas
  denominator_column: base_apuracao_horas
