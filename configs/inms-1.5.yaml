# 250 pontos a cada 0,1% abaixo da meta. /input/inms-001-05.csv corrigido a
# partir do RAS oficial (docs/processo_de_pagamento_junho_2026/relatório_de_
# acompanhamento_de_serviço.html, período 01/06/2026-30/06/2026): Disponibilidade
# Realizada = 99,84% ("Alcançado" no RAS) — a versão anterior deste CSV trazia
# 0,00%/UpTime zerado em todas as colunas, um template não preenchido, não uma
# medição real (ticket de correção de dados, 2026-08-19).
acceptance_test:
  expected:
    shape: precomputed_table
    result_pct: 99.3645
    conforms: false
    penalty_points: 1000.0
