indicator:
  id: INMS-1.6
  contractual_id: "INMS 1.6"
  name: Eficácia no tratamento de chamados

scope:
  contract: "40/2022 - Ministério do Turismo"
  orgao: MTur

source:
  dataset: chamados_reabertos

quality_gates:
  checks: []

calculation:
  shape: ratio
  aggregation: sum
  # ΣCA − ΣCR sobre ΣCA. `denominator_filter` exclui a linha "TOTAIS" — o CSV
  # real traz um resumo por Acordo de Nível de Serviço mais uma linha de
  # total; somar as duas contaria em dobro. Não dá para usar só a linha
  # "TOTAIS" isolada: ela formata milhar com ponto (ex.: "1.622"), que vira
  # 1,622 ao converter para float — as linhas individuais não têm essa
  # formatação, por isso são a soma confiável.
  denominator_filter:
    column: "Acordo de Nível de Serviço"
    not_equals: "TOTAIS"
  sum_numerator_column: "Total de Chamados"
  sum_numerator_subtract_column: "Total de Chamados Reabertos"

target:
  operator: ">="
  value: 97.0

penalty:
  step_points: 200
  step_size_pct: 0.5

# Anexo D (Tabela 28), INMS 1.6: INMS 1.6 = (ΣCA − ΣCR) / ΣCA × 100, meta
# ≥97%, 200 pontos a cada 0,5% abaixo da meta.
#
# O CSV real (input/<órgão>/2026/06/inms-06.csv) é uma tabela pré-agregada
# por Acordo de Nível de Serviço — colunas "Total de Chamados" (CA) e "Total
# de Chamados Reabertos" (CR) prontas, mais uma linha "TOTAIS". Confirmado
# contra o RAS oficial (docs/processo_de_pagamento_junho_2026): fórmula
# "(Total de chamados atendidos − Total de chamados reabertos) / Total de
# chamados atendidos". A soma das linhas individuais do MTur (CA=862, CR=3)
# bate exatamente com a linha "TOTAIS" — cross-check usado para confirmar a
# leitura, não a fonte (ver nota do `denominator_filter` acima sobre o
# formato de milhar da linha "TOTAIS"). Corrigido 2026-08-19: a versão
# anterior filtrava uma coluna "No prazo" (S/N) que não existe nesse
# formato — sempre resultou 0% (penalidade máxima) para os dois órgãos até
# esta correção. Prova sintética em tests/test_remaining_ratio_indicators.py.
acceptance_test:
  expected:
    shape: ratio
    numerator: 859.0
    denominator: 862.0
    result_pct: 99.6520
    conforms: true
    penalty_points: 0.0
