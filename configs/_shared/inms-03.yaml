indicator:
  id: INMS-03
  contractual_id: INMS 1.3
  name: Projetos atendidos dentro do prazo
source:
  dataset: projetos
  period_column: "DataHoraSolicitacao"
quality_gates:
  checks:
  - type: not_null
    column: DataHoraFim
  - type: in_set
    column: No prazo
    values:
    - S
    - N
calculation:
  shape: ratio
  aggregation: count_distinct
  numerator_filter:
    column: No prazo
    equals: S
target:
  operator: '>='
  value: 100.0
penalty:
  step_points: 200
  step_size_pct: 1.0
