indicator:
  id: INMS-1.14
  contractual_id: "INMS 1.14"
  name: Índice de disponibilidade de serviços de infraestrutura

scope:
  contract: "40/2022 - Ministério Cultura"
  orgao: MinC

source:
  dataset: disponibilidade_infra

quality_gates:
  checks: []

calculation:
  shape: precomputed_table
  result_column: inms_1_14_percentual
  name_column: servico_infraestrutura
  numerator_column: numerador_inms_horas
  denominator_column: base_apuracao_horas
  penalty_column: penalidade_pontos

target:
  operator: ">="
  value: 99.5

penalty:
  step_points: 250
  step_size_pct: 0.1

# Anexo D (Tabela 28), INMS 1.14: meta ≥99,5% POR serviço de infraestrutura
# (a-f: File Server, Telefonia, Mensageria, Impressão, WI-FI, Rede — cada um
# seu próprio YAML+CSV), 250 pontos a cada 0,1% abaixo da meta.
# /input/inms-001-14.csv corrigido a partir do RAS oficial
# (docs/processo_de_pagamento_junho_2026/relatório_de_acompanhamento_de_serviço.html,
# período 01/06/2026-30/06/2026): Disponibilidade Realizada = 98,49% ("Não
# Alcançado" no RAS, glosa dispensada por justificativa aceita pela fiscalização
# — regra de negócio fora do escopo desta pipeline, ver §12.2). A versão
# anterior deste CSV trazia 0,00%/UpTime zerado em todas as colunas, um
# template não preenchido, não uma medição real (ticket de correção de
# dados, 2026-08-19).
acceptance_test:
  expected:
    shape: precomputed_table
    result_pct: 99.6501
    conforms: false
    penalty_points: 750.0
