indicator:
  id: INMS-08
  contractual_id: "INMS 1.8"
  name: Ocorrências de Desconformidade Técnica

scope:
  contract: "40/2022 - Ministério da Cultura"
  orgao: MinC

source:
  dataset: desconformidade_tecnica

quality_gates:
  checks: []

calculation:
  shape: precomputed_table
  result_column: inms_1_8_total_pdt
  result_is_percent: false
  name_column: servico_nome
  penalty_column: pontos_acima_meta

# Anexo E (Tabela 29): soma linear de pontos de desconformidade técnica, sem
# meta percentual. A partir da reavaliação de 2026-08-19 o dataset
# (`inms-08.csv`) é a tabela de apuração agregada por serviço: cada linha já
# traz o total de PDT (`inms_1_8_total_pdt`) e o excesso sobre a meta de
# pontos (`pontos_acima_meta`), lido direto pelo shape `precomputed_table`
# (modo pontos, `result_is_percent: false`).
target:
  operator: ">="
  value: 0.0

acceptance_test:
  expected:
    shape: precomputed_table
    result_pct: 0.0
    conforms: true
    penalty_points: 0.0
