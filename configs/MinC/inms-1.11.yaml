indicator:
  id: INMS-1.11
  contractual_id: "INMS 1.11"
  name: Índice de chamadas telefônicas abandonadas

scope:
  contract: "40/2022 - Ministério da Cultura"
  orgao: MinC

source:
  dataset: telefonemas

quality_gates:
  checks: []

calculation:
  shape: ratio
  aggregation: count_distinct
  # DESCONEXÃO ∈ {Timeout, Abandon} = a ligação nunca chegou a um agente
  # (abandono/estouro de fila); {Caller, Agent} = desligamento normal após
  # atendimento. Não há uma coluna "abandonada?" explícita no CSV real —
  # esta é uma inferência a partir dos 4 valores observados de DESCONEXÃO,
  # plausível mas não confirmada por nenhuma fonte primária (mesma natureza
  # de lacuna do INMS 1.2 — SLA por substring).
  numerator_filter:
    column: "DESCONEXÃO"
    in_values: ["Timeout", "Abandon"]

target:
  operator: "<="
  value: 5.0

penalty:
  step_points: 50
  step_size_pct: 1.0

# Anexo D (Tabela 28), INMS 1.11: INMS 1.11 = TCTA/TCT × 100, meta ≤5%, 50
# pontos a cada 1% acima da meta. /input/inms-001-11.csv real: 119/924 =
# 12,88% abandonadas — bem acima da meta.
acceptance_test:
  expected:
    shape: ratio
    numerator: 119
    denominator: 924
    result_pct: 12.8788
    conforms: false
    penalty_points: 393.94
