indicator:
  id: INMS-03
  contractual_id: "INMS 1.3"
  name: Projetos atendidos dentro do prazo

scope:
  contract: "40/2022 - Ministério da Cultura"
  orgao: MinC

source:
  dataset: projetos

quality_gates:
  checks: []

calculation:
  shape: ratio
  aggregation: sum
  sum_numerator_column: "DiasProjeto"
  sum_denominator_extra_column: "DiasAtraso"

target:
  operator: ">="
  value: 100.0

penalty:
  step_points: 200
  step_size_pct: 1.0

# Anexo D (Tabela 28), INMS 1.3: INMS 1.3 = ΣDPE / (ΣDPE + ΣDA) × 100, meta
# 100%, 200 pontos a cada 1% abaixo da meta (sem base — ver Penalty.base_points).
#
# `aggregation: sum` soma colunas numéricas por linha de projeto (DPE = dias
# do projeto conforme planejado, DA = dias de atraso), não conta linhas. O
# /input/inms-001-03.csv real tem só o cabeçalho genérico do ITSM — confirmado
# pela fiscalização que não houve projetos no período 06/2026, não uma lacuna
# de dado. Zero projetos elegíveis (denominador 0/0) não é o mesmo que 0% de
# projetos entregues no prazo — não há base para apurar a meta, logo não há
# glosa (ver RatioStrategy.calculate, denominator == 0). A prova real do
# somatório está no fixture sintético em tests/test_ratio_sum_and_precomputed.py.
acceptance_test:
  expected:
    shape: ratio
    numerator: 0
    denominator: 0
    result_pct: 0.0
    conforms: true
    penalty_points: 0.0
