indicator:
  id: INMS-1.12
  contractual_id: "INMS 1.12"
  name: Índice de chamadas telefônicas atendidas em até 20 segundos

scope:
  contract: "40/2022 - Ministério da Cultura"
  orgao: MinC

source:
  dataset: chamadas_telefonicas

quality_gates:
  checks: []

calculation:
  shape: ratio
  aggregation: count_distinct
  numerator_filter:
    column: "ESPERA"
    max_seconds: 20

target:
  operator: ">="
  value: 95.0

penalty:
  step_points: 25
  step_size_pct: 0.1

# Anexo D (Tabela 28), INMS 1.12: INMS 1.12 = TCA20/TCT × 100, meta ≥95%, 25
# pontos a cada 0,1% abaixo da meta. /input/inms-001-12.csv real: as 492
# chamadas foram atendidas em até 20s (ESPERA ≤ 0:00:20) — 100%.
acceptance_test:
  expected:
    shape: ratio
    numerator: 885
    denominator: 924
    result_pct: 95.7792
    conforms: true
    penalty_points: 0.0
