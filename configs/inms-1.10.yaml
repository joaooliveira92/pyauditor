indicator:
  id: INMS-1.10
  contractual_id: "INMS 1.10"
  name: Taxa de implantação de controles de segurança

scope:
  contract: "40/2022 - Ministério Cultura"
  orgao: MinC

source:
  dataset: controles_seguranca

quality_gates:
  checks: []

calculation:
  shape: precomputed_table
  result_column: taxa_implantacao_percentual
  name_column: dominio_controle
  numerator_column: qcsi_controles_implantados
  denominator_column: qrc_controles_recomendados
  penalty_column: penalidade_pontos

target:
  operator: ">="
  value: 100.0

# Anexo D (Tabela 28), INMS 1.10: CNI = QRC - QCSI (Quantidade de Controles
# Recomendados - Quantidade de controles de Segurança Implantados), meta
# "= 100%", 1000 pontos por controle não implementado.
#
# O /input/inms-001-10.csv real tem só o cabeçalho genérico do ITSM
# (mesmo formato usado pelos indicadores `ratio`), sem nenhuma linha de
# dado — igual ao INMS 1.8 (ticket 11), o Anexo D não define como um
# controle de segurança recomendado/implantado é registrado no dataset de
# origem.
#
# `implemented_filter` acima aponta para o schema de preenchimento manual
# provisório definido em docs/spec/inms-pipeline.md §2 (INMS 1.10) — colunas
# ID_Controle, Framework, Descricao, Implantado — não o header do CSV real,
# que continua vazio. Se/quando a fiscalização identificar um sistema real
# de acompanhamento de controles de segurança, este schema deve ser
# revisado. O acceptance_test abaixo reflete a realidade do arquivo real
# vazio (0 recomendados, 0 implantados, CNI=0) — a prova da matemática de
# `count_difference` sobre o novo schema está em
# tests/test_manual_ingestion_inms_1_10.py (dados sintéticos realistas) e
# tests/test_count_difference.py (sintético mínimo).
acceptance_test:
  expected:
    shape: precomputed_table
    result_pct: 92.8571
    conforms: false
    penalty_points: 5000.0
