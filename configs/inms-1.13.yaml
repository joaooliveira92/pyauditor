indicator:
  id: INMS-1.13
  contractual_id: "INMS 1.13"
  name: Índice de chamados atendidos no Nível I

scope:
  contract: "40/2022 - Ministério Cultura"
  orgao: MinC

source:
  csv: inms-001-13.csv
  delimiter: ";"
  encoding: utf-8-sig

quality_gates:
  checks: []

calculation:
  shape: ratio
  aggregation: count_distinct
  numerator_filter:
    column: "Grupo_executor"
    contains: "1º Nível"

target:
  operator: ">="
  # Anexo D não fixa um percentual para INMS 1.13 — o texto diz "Será
  # acordado com a CONTRATADA uma taxa... revisão trimestral". 90% é um
  # placeholder documentado, não um valor contratual; precisa ser confirmado
  # com o gestor do contrato antes de uso em produção.
  value: 90.0

penalty:
  step_points: 50
  step_size_pct: 1.0

# Anexo D (Tabela 28), INMS 1.13: INMS 1.13 = TCN1/TCR × 100, meta negociada
# (ver nota acima), 50 pontos a cada 1% abaixo da meta acordada.
# /input/inms-001-13.csv real: as 116 linhas são todas Grupo_executor =
# "(CIT/MINC) - 1º Nível" — TCN1=TCR=116, 100%.
acceptance_test:
  expected:
    shape: ratio
    numerator: 116
    denominator: 116
    result_pct: 100.0
    conforms: true
    penalty_points: 0.0
